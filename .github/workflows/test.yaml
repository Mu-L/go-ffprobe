on: [push, pull_request]
name: Test
jobs:
  test:
    strategy:
      matrix:
        go-version: [1.26.x, 1.27.x]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name:   Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffprobe -version

      - name:   Install Go
        uses:   actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}

      - name:   Checkout code
        uses:   actions/checkout@v7

      - name:   Test
        run:    go test -v -timeout 2m ./...
